services:
  frontend:
    container_name: lumora-development-frontend
    ports: !override
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"

  backend:
    container_name: lumora-development-backend
    ports: !override
      - "127.0.0.1:${BACKEND_PORT:-8001}:8000"
    volumes: !override
      - hf-cache:/root/.cache/huggingface
      - ./deploy/runtime/development/uploads:/app/uploads
    environment:
      LUMORA_DIAGNOSTICS_URL: ""

  postgres:
    container_name: lumora-development-postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    name: lumora-development-postgres-data
  hf-cache:
    name: lumora-development-hf-cache
