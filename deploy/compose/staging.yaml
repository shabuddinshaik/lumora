services:
  frontend:
    container_name: lumora-staging-frontend
    ports: !override
      - "127.0.0.1:${FRONTEND_PORT:-8082}:80"

  backend:
    container_name: lumora-staging-backend
    ports: !override
      - "127.0.0.1:${BACKEND_PORT:-8002}:8000"
    volumes: !override
      - hf-cache:/root/.cache/huggingface
      - ./deploy/runtime/staging/uploads:/app/uploads
    environment:
      LUMORA_DIAGNOSTICS_URL: ""

  postgres:
    container_name: lumora-staging-postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    name: lumora-staging-postgres-data
  hf-cache:
    name: lumora-staging-hf-cache
